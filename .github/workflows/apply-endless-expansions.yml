name: Apply Endless Audit Docs

on:
  push:
    branches:
      - write/endless-rail-107-116-narrative-pass
    paths:
      - shared/tools/_tmp_expand_107_116.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audit document updates
        run: python shared/tools/_tmp_expand_107_116.py
      - name: Commit document updates
        shell: bash
        run: |
          git config user.name "novel-audit-bot"
          git config user.email "novel-audit-bot@users.noreply.github.com"
          git add novels/endless-rail/README.md novels/endless-rail/chapters/index.md novels/endless-rail/docs/short-term-outline.md novels/endless-rail/docs/next-window-handoff.md novels/endless-rail/docs/capability-growth-ledger.md
          if git diff --cached --quiet; then
            echo "No document changes"
            exit 0
          fi
          git commit -m "docs(novel): advance endless rail state through chapter 116"
          git pull --rebase origin write/endless-rail-107-116-narrative-pass
          git push origin HEAD:write/endless-rail-107-116-narrative-pass
