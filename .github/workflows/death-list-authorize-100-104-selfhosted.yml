name: Death List Authorize 100-104 Selfhosted

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/death-list-authorize-100-104-selfhosted.yml"
  workflow_dispatch:

concurrency:
  group: death-list-authorize-100-104-selfhosted
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase to latest main
        shell: powershell
        run: |
          git fetch origin main
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Append audited authorization
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $code = @'
          import datetime
          import json
          from pathlib import Path

          path = Path("novels/death-list/platform-sync/queue.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          op_id = "death-list-create-100-104-20260916"

          existing = [op for op in data.get("operations", []) if op.get("id") == op_id]
          if existing:
              print(f"{op_id} already exists; no duplicate authorization created.")
          else:
              pending = [
                  op for op in data.get("operations", [])
                  if op.get("status") == "pending"
                  and op.get("authorized") is True
                  and (op.get("audit") or {}).get("status") == "passed"
              ]
              if pending:
                  raise SystemExit(f"Refusing to append while another authorized pending operation exists: {[op.get('id') for op in pending]}")

              data["operations"].append({
                  "id": op_id,
                  "action": "create",
                  "chapters": "100-104",
                  "status": "pending",
                  "authorized": True,
                  "audit": {
                      "status": "passed",
                      "source": "Death List Quality Selfhosted on merged main, manual Cold Read/continuity review, and fresh self-hosted read-only Fanqie reconciliation",
                      "source_run": "35059925988",
                      "source_job": "104677886516",
                      "source_commit": "5498d84d8eb4ce19a3a6ea36e223ed3a33afbf3c",
                      "reconcile_run": "35060070159",
                      "reconcile_job": "104678319619",
                      "remote_prefix": "1-99",
                      "remote_status": "59 published; 40 scheduled",
                      "remote_differences": "local-only 100-104; no remote-only chapters, duplicate numbers, title mismatches, or position mismatches",
                      "chapter_body_characters": {
                          "100": 2348,
                          "101": 2125,
                          "102": 2033,
                          "103": 2187,
                          "104": 2109
                      },
                      "review_notes": "The complete five-chapter group totals 10802 non-whitespace body characters. The merged-main self-hosted latest-five quality gate passed with complete novel_gate.py; Narrative V1 stayed below review thresholds and Humanizer/Prose/Meta hard findings were zero, while Dialogue/Humanizer warnings were manually Cold Read rather than mechanically cleared. Chapters 100-103 deliberately return to ordinary competition, campus maintenance, and school-media life after D-038: the team result is independent of the safety event, the judged version is archived normally, and a loose stair handrail already in the property repair workflow is specifically not escalated through the safety-duty line. Chapter 104 opens D-039-D-042 as four separate midnight records across different city locations and time windows; the text does not infer a common root or add any new list function. E-001 remains restricted, E-002 active testing remains paused, Xu Zhewen returns to ordinary venue work, and Zhou Yu remains only partially informed. Fresh self-hosted read-only reconciliation run 35060070159/job 104678319619 confirmed exactly 99 numbered remote items, 59 published and 40 scheduled, with local-only 100-104 and no remote-only chapters, duplicate numbers, title mismatches, or position mismatches. Preserve chapters 1-99 and every existing schedule; create only 100-104 together for 2026-09-25 00:00 Asia/Shanghai. Do not publish immediately.",
                      "already_present_chapters": []
                  },
                  "schedule_mode": "fixed_start",
                  "start_date": "2026-09-25"
              })
              data["updated_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"Appended {op_id}.")
          '@
          $code | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate authorization plan
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python shared/tools/fanqie_compat.py validate novels/death-list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $planText = python shared/tools/fanqie_compat.py plan novels/death-list --json | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = $planText | ConvertFrom-Json
          if ([int]$plan.pending_count -ne 1) { throw "Expected exactly one pending operation; found $($plan.pending_count)." }
          $pending = @($plan.pending_operations)[0]
          if ($pending.id -ne 'death-list-create-100-104-20260916') { throw "Unexpected pending operation: $($pending.id)" }
          if ($pending.chapter_spec -ne '100-104') { throw "Unexpected chapter spec: $($pending.chapter_spec)" }
          Write-Host "Authorization plan PASS: $($pending.id), chapters $($pending.chapter_spec)."

      - name: Commit authorization queue
        shell: powershell
        run: |
          git diff --exit-code -- novels/death-list/platform-sync/queue.json
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Queue already contains this authorization; nothing to commit.'
            exit 0
          }
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          git add -- novels/death-list/platform-sync/queue.json
          git commit -m "chore(fanqie): authorize chapters 100-104"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
