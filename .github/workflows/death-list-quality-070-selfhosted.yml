name: Death List Chapter 70 Quality Selfhosted

on:
  pull_request:
    paths:
      - ".github/workflows/death-list-quality-070-selfhosted.yml"
      - "novels/death-list/chapters/chapter-070.md"
      - "shared/tools/novel_gate.py"
      - "shared/tools/narrative_guard.py"
      - "shared/tools/dialogue_guard.py"
      - "shared/tools/humanizer_guard.py"
      - "shared/tools/prose_guard.py"
      - "shared/tools/meta_narrative_guard.py"
  push:
    branches:
      - "feat/death-list-070"
    paths:
      - ".github/workflows/death-list-quality-070-selfhosted.yml"
      - "novels/death-list/chapters/chapter-070.md"
      - "shared/tools/novel_gate.py"
      - "shared/tools/narrative_guard.py"
      - "shared/tools/dialogue_guard.py"
      - "shared/tools/humanizer_guard.py"
      - "shared/tools/prose_guard.py"
      - "shared/tools/meta_narrative_guard.py"
  workflow_dispatch:

concurrency:
  group: death-list-quality-070-selfhosted
  cancel-in-progress: false

jobs:
  audit-70:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Count chapter body characters
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          @'
          import re
          from pathlib import Path

          path = Path("novels/death-list/chapters/chapter-070.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          if lines and lines[0].lstrip().startswith("#"):
              text = "\n".join(lines[1:])
          count = len(re.sub(r"\s+", "", text))
          print(f"chapter 70: {count}")
          if count < 2000:
              raise SystemExit(f"chapter 70 below 2000-character floor: {count}")
          '@ | python -
      - name: Run complete novel gate for chapter 70
        shell: powershell
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python shared/tools/novel_gate.py novels/death-list/chapters/chapter-070.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
