name: Death List Quality Selfhosted

on:
  pull_request:
    paths:
      - ".github/workflows/death-list-quality-selfhosted.yml"
      - "novels/death-list/chapters/chapter-06[0-4].md"
      - "shared/tools/novel_gate.py"
      - "shared/tools/narrative_guard.py"
      - "shared/tools/dialogue_guard.py"
      - "shared/tools/humanizer_guard.py"
      - "shared/tools/prose_guard.py"
      - "shared/tools/meta_narrative_guard.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/death-list-quality-selfhosted.yml"
      - "novels/death-list/chapters/chapter-06[0-4].md"
      - "shared/tools/novel_gate.py"
      - "shared/tools/narrative_guard.py"
      - "shared/tools/dialogue_guard.py"
      - "shared/tools/humanizer_guard.py"
      - "shared/tools/prose_guard.py"
      - "shared/tools/meta_narrative_guard.py"
  workflow_dispatch:

concurrency:
  group: death-list-quality-selfhosted
  cancel-in-progress: false

jobs:
  audit-60-64:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Count chapter body characters
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          @'
          import re
          from pathlib import Path

          total = 0
          for n in range(60, 65):
              path = Path(f"novels/death-list/chapters/chapter-{n:03d}.md")
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              if lines and lines[0].lstrip().startswith("#"):
                  text = "\n".join(lines[1:])
              count = len(re.sub(r"\s+", "", text))
              total += count
              print(f"chapter {n}: {count}")
              if count < 2000:
                  raise SystemExit(f"chapter {n} below 2000-character floor: {count}")
          print(f"batch 60-64 total: {total}")
          if total <= 9999:
              raise SystemExit(f"batch 60-64 does not exceed 9999 characters: {total}")
          '@ | python -
      - name: Run complete novel gate for chapters 60-64
        shell: powershell
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python shared/tools/novel_gate.py `
            novels/death-list/chapters/chapter-060.md `
            novels/death-list/chapters/chapter-061.md `
            novels/death-list/chapters/chapter-062.md `
            novels/death-list/chapters/chapter-063.md `
            novels/death-list/chapters/chapter-064.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
