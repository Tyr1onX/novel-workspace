name: Endless Rail Length Audit

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Endless Rail chapter length report
        run: |
          python novels/endless-rail/tools/audit_chapter_lengths.py \
            --start 109 \
            --hard-minimum 2000 \
            > endless-rail-length-audit.json
      - name: Persist latest length audit snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p novels/endless-rail/docs
          cp endless-rail-length-audit.json novels/endless-rail/docs/length-audit-latest.json
          if [ -z "$(git status --porcelain -- novels/endless-rail/docs/length-audit-latest.json)" ]; then
            echo "Length audit snapshot unchanged."
            exit 0
          fi
          git config user.name "rail-audit-bot"
          git config user.email "rail-audit-bot@users.noreply.github.com"
          git add novels/endless-rail/docs/length-audit-latest.json
          git commit -m "chore(rail): refresh length audit snapshot [skip ci]"
          git push origin HEAD:main
      - name: Enforce Endless Rail chapter length floor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('endless-rail-length-audit.json').read_text(encoding='utf-8'))
          hard = report.get('hard_chapters', [])
          if hard:
              details = ', '.join(
                  f"{item['number']}={item['chars']}"
                  for item in report.get('chapters', [])
                  if item.get('status') == 'hard-short'
              )
              raise SystemExit(f"chapters below 2000 non-whitespace body chars: {details}")
          print(f"PASS: {report.get('count', 0)} chapters checked; hard_count=0")
          PY
