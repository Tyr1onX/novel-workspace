name: Endless Rail Length Audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Endless Rail chapter lengths
        run: |
          python novels/endless-rail/tools/audit_chapter_lengths.py \
            --start 109 \
            --hard-minimum 2000 \
            --fail
