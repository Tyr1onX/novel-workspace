name: Endless Rail September Stage 2 Sync

on:
  push:
    branches: [main]
    paths:
      - "novels/endless-rail/platform-sync/queue.json"
      - "novels/endless-rail/platform-sync/stage-171-197.trigger"
  workflow_dispatch:

concurrency:
  group: fanqie-platform-mutation
  cancel-in-progress: false

jobs:
  sync-171-197:
    if: ${{ !contains(github.event.head_commit.message || '', 'record rail 171-197 self-hosted sync result') }}
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        shell: powershell
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Re-run repository and length gates
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python shared/tools/fanqie_compat.py validate novels/endless-rail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python novels/endless-rail/tools/audit_chapter_lengths.py --start 171 --end 203 --hard-minimum 2000 --fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json
          from pathlib import Path
          policy = json.loads(Path('novels/endless-rail/platform-sync/policy.json').read_text(encoding='utf-8'))
          s = policy['schedule']
          assert s['chapters_per_day'] == 3 and s['group_size'] == 3
          assert s['require_complete_groups'] is True
          assert s['daily_word_floor']['minimum_chars_exclusive'] == 5999
          audit = Path('novels/endless-rail/docs/audit-171-203.md').read_text(encoding='utf-8')
          assert 'PASS' in audit
          q = json.loads(Path('novels/endless-rail/platform-sync/queue.json').read_text(encoding='utf-8'))
          first = next(op for op in q['operations'] if op['id'] == 'rail-create-159-170-three-per-day-20260911')
          assert first['status'] == 'completed' and first['authorized'] is True
          assert all(op.get('id') != 'rail-create-171-197-three-per-day-20260911' for op in q['operations'])
          print('Stage 2 repository gates PASS.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Fresh read-only preflight reconciliation
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $report = "$env:RUNNER_TEMP\fanqie-preflight-rail-171-197.json"
          python shared/tools/fanqie_compat.py reconcile novels/endless-rail --runtime "${{ steps.runtime.outputs.path }}" --output $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'fanqie-preflight-rail-171-197.json').read_text(encoding='utf-8-sig'))
          assert str(r['book_id']) == '7670480372831882302'
          assert r['remote']['numbered_item_count'] == 170
          assert r['remote']['min_chapter'] == 1 and r['remote']['max_chapter'] == 170
          d = r['differences']
          assert d['local_only_chapters'] == list(range(171, 204)), d['local_only_chapters']
          assert d['remote_only_chapters'] == [] and d['title_mismatches'] == [] and d['position_mismatches'] == []
          assert not d['duplicate_remote_chapter_numbers']
          print('Stage 2 preflight PASS: remote exactly 1-170.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Add and authorize stage 2 operation after reconcile
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          @'
          import json
          from pathlib import Path
          p = Path('novels/endless-rail/platform-sync/queue.json')
          q = json.loads(p.read_text(encoding='utf-8'))
          op_id = 'rail-create-171-197-three-per-day-20260911'
          assert all(op.get('id') != op_id for op in q['operations'])
          q['operations'].append({
            'id': op_id,
            'action': 'create',
            'chapters': '171-197',
            'schedule_mode': 'fixed_start',
            'start_date': '2026-09-20',
            'status': 'pending',
            'authorized': True,
            'audit': {
              'status': 'passed',
              'source': 'docs/audit-171-203.md plus current self-hosted hard length gate and fresh read-only reconciliation',
              'reconcile': 'remote exactly 1-170; local-only 171-203; zero duplicate/title/position mismatches'
            },
            'reason': 'Author confirmed three chapters per day. Create nine complete three-chapter groups for 2026-09-20 through 2026-09-28 after fresh preflight.'
          })
          q['updated_at'] = '2026-09-11T10:33:00+08:00'
          p.write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | python -
      - name: Execute stage 2 sync
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python shared/tools/fanqie_compat.py sync novels/endless-rail --runtime "${{ steps.runtime.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify remote 171-197 and schedule
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $report = "$env:RUNNER_TEMP\fanqie-postsync-rail-197.json"
          python shared/tools/fanqie_compat.py reconcile novels/endless-rail --runtime "${{ steps.runtime.outputs.path }}" --output $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'fanqie-postsync-rail-197.json').read_text(encoding='utf-8-sig'))
          assert r['remote']['numbered_item_count'] == 197
          assert r['remote']['min_chapter'] == 1 and r['remote']['max_chapter'] == 197
          d = r['differences']
          assert d['local_only_chapters'] == list(range(198, 204)), d['local_only_chapters']
          assert d['remote_only_chapters'] == [] and d['title_mismatches'] == [] and d['position_mismatches'] == []
          assert not d['duplicate_remote_chapter_numbers']
          items = {int(x['chapter_number']): x for x in r['remote_items'] if x.get('chapter_number') is not None}
          for n in range(171, 198):
              day = 20 + (n - 171) // 3
              expected = f'2026-09-{day:02d}T00:00+08:00'
              assert items[n]['scheduled_at'] == expected, (n, items[n].get('scheduled_at'), expected)
              assert items[n]['status'] in {'scheduled','reviewing'}, (n, items[n]['status'])
          print('Stage 2 postflight PASS: 171-197 scheduled 3/day through Sep 28.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fail close stage 2 authorization on any failure
        if: failure()
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          @'
          import json
          from pathlib import Path
          p = Path('novels/endless-rail/platform-sync/queue.json')
          q = json.loads(p.read_text(encoding='utf-8'))
          target = next((op for op in q['operations'] if op.get('id') == 'rail-create-171-197-three-per-day-20260911'), None)
          if target and target.get('status') != 'completed':
              target['authorized'] = False
              target['status'] = 'blocked_selfhosted_failure_needs_reconcile'
              target.setdefault('audit', {})['failure_guard'] = 'Self-hosted stage did not complete verification; authorization revoked. Fresh read-only reconcile required before retry.'
              p.write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | python -
      - name: Prepare final-stage trigger after verified stage 2
        if: success()
        shell: powershell
        run: |
          Set-Content -Path novels/endless-rail/platform-sync/stage-198-203.trigger -Encoding UTF8 -Value "stage2_verified_run=${{ github.run_id }}"
      - name: Persist ledgers and final-stage trigger
        if: always()
        shell: powershell
        run: |
          $paths = @(git status --porcelain | ForEach-Object { $_.Substring(3) } | Where-Object { $_ -match '^novels/endless-rail/platform-sync/(queue|sync-state)\.json$' -or $_ -eq 'novels/endless-rail/platform-sync/stage-198-203.trigger' })
          if ($paths.Count -eq 0) { exit 0 }
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          foreach ($path in $paths) { git add -- $path }
          git commit -m "chore(fanqie): record rail 171-197 self-hosted sync result"
          git pull --rebase origin main
          git push origin HEAD:main
