name: Endless Rail September Final Stage Sync

on:
  push:
    branches: [main]
    paths:
      - "novels/endless-rail/platform-sync/stage-198-203.trigger"
  workflow_dispatch:

concurrency:
  group: fanqie-platform-mutation
  cancel-in-progress: false

jobs:
  sync-198-203:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        shell: powershell
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Re-run repository and length gates
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python shared/tools/fanqie_compat.py validate novels/endless-rail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python novels/endless-rail/tools/audit_chapter_lengths.py --start 198 --end 203 --hard-minimum 2000 --fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json
          from pathlib import Path
          policy = json.loads(Path('novels/endless-rail/platform-sync/policy.json').read_text(encoding='utf-8'))
          s = policy['schedule']
          assert s['chapters_per_day'] == 3 and s['group_size'] == 3
          assert s['require_complete_groups'] is True
          assert s['daily_word_floor']['minimum_chars_exclusive'] == 5999
          audit = Path('novels/endless-rail/docs/audit-171-203.md').read_text(encoding='utf-8')
          assert 'PASS。' in audit or 'PASS' in audit
          q = json.loads(Path('novels/endless-rail/platform-sync/queue.json').read_text(encoding='utf-8'))
          previous = next(op for op in q['operations'] if op['id'] == 'rail-create-171-197-three-per-day-20260911')
          assert previous['status'] == 'completed' and previous['authorized'] is True
          assert all(op.get('id') != 'rail-create-198-203-three-per-day-20260911' for op in q['operations'])
          print('Final stage repository gates PASS.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Fresh read-only preflight reconciliation
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $report = "$env:RUNNER_TEMP\fanqie-preflight-rail-198-203.json"
          python shared/tools/fanqie_compat.py reconcile novels/endless-rail --runtime "${{ steps.runtime.outputs.path }}" --output $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'fanqie-preflight-rail-198-203.json').read_text(encoding='utf-8-sig'))
          assert str(r['book_id']) == '7670480372831882302'
          assert r['remote']['numbered_item_count'] == 197
          assert r['remote']['min_chapter'] == 1 and r['remote']['max_chapter'] == 197
          d = r['differences']
          assert d['local_only_chapters'] == list(range(198, 204)), d['local_only_chapters']
          assert d['remote_only_chapters'] == [] and d['title_mismatches'] == [] and d['position_mismatches'] == []
          assert not d['duplicate_remote_chapter_numbers']
          print('Final stage preflight PASS: remote exactly 1-197.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Add and authorize final operation after reconcile
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          @'
          import json
          from pathlib import Path
          p = Path('novels/endless-rail/platform-sync/queue.json')
          q = json.loads(p.read_text(encoding='utf-8'))
          op_id = 'rail-create-198-203-three-per-day-20260911'
          assert all(op.get('id') != op_id for op in q['operations'])
          q['operations'].append({
            'id': op_id,
            'action': 'create',
            'chapters': '198-203',
            'schedule_mode': 'fixed_start',
            'start_date': '2026-09-29',
            'status': 'pending',
            'authorized': True,
            'audit': {
              'status': 'passed',
              'source': 'docs/audit-171-203.md plus current self-hosted hard length gate and fresh read-only reconciliation',
              'reconcile': 'remote exactly 1-197; local-only 198-203; zero duplicate/title/position mismatches'
            },
            'reason': 'Author confirmed three chapters per day. Create the final two complete three-chapter groups for 2026-09-29 and 2026-09-30 after fresh preflight.'
          })
          q['updated_at'] = '2026-09-11T10:33:00+08:00'
          p.write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | python -
      - name: Execute final sync
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python shared/tools/fanqie_compat.py sync novels/endless-rail --runtime "${{ steps.runtime.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify remote through September 30
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $report = "$env:RUNNER_TEMP\fanqie-postsync-rail-203.json"
          python shared/tools/fanqie_compat.py reconcile novels/endless-rail --runtime "${{ steps.runtime.outputs.path }}" --output $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'fanqie-postsync-rail-203.json').read_text(encoding='utf-8-sig'))
          assert r['remote']['numbered_item_count'] == 203
          assert r['remote']['min_chapter'] == 1 and r['remote']['max_chapter'] == 203
          d = r['differences']
          assert d['local_only_chapters'] == [], d['local_only_chapters']
          assert d['remote_only_chapters'] == [] and d['title_mismatches'] == [] and d['position_mismatches'] == []
          assert not d['duplicate_remote_chapter_numbers']
          items = {int(x['chapter_number']): x for x in r['remote_items'] if x.get('chapter_number') is not None}
          for n in range(198, 204):
              day = 29 + (n - 198) // 3
              expected = f'2026-09-{day:02d}T00:00+08:00'
              assert items[n]['scheduled_at'] == expected, (n, items[n].get('scheduled_at'), expected)
              assert items[n]['status'] in {'scheduled','reviewing'}, (n, items[n]['status'])
          report_out = Path('novels/endless-rail/docs/month-end-fanqie-completion-20260911.md')
          report_out.write_text('''# 2026年9月底番茄排期完成记录\n\n- 口径：2026-09-16 至 2026-09-30，每日3章，00:00 Asia/Shanghai。\n- 覆盖：第159～203章，共45章。\n- 最终只读核对：远端章节精确为1～203；无本地缺失、无远端多余、无重复章节号、无标题错位、无位置错位。\n- 第159～161章排期9月16日，之后每3章顺延一天；第198～200章排期9月29日，第201～203章排期9月30日。\n- 发布前正文门禁：每章至少2000非空白正文字符；内容质量依据 `docs/audit-159-170.md` 与 `docs/audit-171-203.md`，并在各发布阶段重新执行长度检查。\n- 本记录只说明章节已创建并排期到番茄后台，不替代平台后续审核/正式上线状态。\n''', encoding='utf-8')
          print('FINAL PASS: remote 1-203 and September schedule through Sep 30 verified.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fail close final-stage authorization on any failure
        if: failure()
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          @'
          import json
          from pathlib import Path
          p = Path('novels/endless-rail/platform-sync/queue.json')
          q = json.loads(p.read_text(encoding='utf-8'))
          target = next((op for op in q['operations'] if op.get('id') == 'rail-create-198-203-three-per-day-20260911'), None)
          if target and target.get('status') != 'completed':
              target['authorized'] = False
              target['status'] = 'blocked_selfhosted_failure_needs_reconcile'
              target.setdefault('audit', {})['failure_guard'] = 'Self-hosted final stage did not complete verification; authorization revoked. Fresh read-only reconcile required before retry.'
              p.write_text(json.dumps(q, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          '@ | python -
      - name: Persist ledgers and completion record
        if: always()
        shell: powershell
        run: |
          $paths = @(git status --porcelain | ForEach-Object { $_.Substring(3) } | Where-Object { $_ -match '^novels/endless-rail/platform-sync/(queue|sync-state)\.json$' -or $_ -eq 'novels/endless-rail/docs/month-end-fanqie-completion-20260911.md' })
          if ($paths.Count -eq 0) { exit 0 }
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          foreach ($path in $paths) { git add -- $path }
          git commit -m "chore(fanqie): record rail September month-end completion"
          git pull --rebase origin main
          git push origin HEAD:main
