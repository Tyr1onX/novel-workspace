name: Fanqie Authorized Sync Selfhosted

# Manual trigger refresh for audited chapters 90-94 authorization on 2026-09-15.
on:
  push:
    branches:
      - main
    paths:
      - "novels/death-list/platform-sync/queue.json"
      - ".github/workflows/fanqie-authorized-sync-selfhosted.yml"
  workflow_dispatch:

concurrency:
  group: fanqie-authorized-sync-selfhosted
  cancel-in-progress: false

jobs:
  sync-death-list:
    if: ${{ !contains(github.event.head_commit.message || '', 'record self-hosted sync result') }}
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase to latest main before platform mutation
        shell: powershell
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Validate one audited pending create
        id: plan
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python shared/tools/fanqie_compat.py validate novels/death-list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $planText = python shared/tools/fanqie_compat.py plan novels/death-list --json | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = $planText | ConvertFrom-Json

          if ([int]$plan.pending_count -eq 0) {
            Write-Host 'No authorized pending operations.'
            'has_pending=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ([int]$plan.pending_count -ne 1) {
            throw "Expected exactly one pending authorized operation; found $($plan.pending_count)."
          }

          $planned = @($plan.pending_operations)[0]
          if ($planned.action -ne 'create') {
            throw "Authorized self-hosted workflow only accepts create operations; got $($planned.action)."
          }
          $numbers = @($planned.chapters | ForEach-Object { [int]$_ })
          if ($numbers.Count -eq 0) { throw 'Pending create resolved to no chapters.' }
          for ($i = 1; $i -lt $numbers.Count; $i++) {
            if ($numbers[$i] -ne ($numbers[$i - 1] + 1)) {
              throw 'Pending create chapters must be consecutive.'
            }
          }

          $queue = Get-Content -Raw -Encoding UTF8 novels/death-list/platform-sync/queue.json | ConvertFrom-Json
          $matches = @($queue.operations | Where-Object { $_.id -eq $planned.id })
          if ($matches.Count -ne 1) { throw 'Planned operation is missing or duplicated in queue.json.' }
          $op = $matches[0]
          if ($op.status -ne 'pending' -or -not $op.authorized -or $op.audit.status -ne 'passed') {
            throw 'Planned operation is not pending, authorized, and audit-passed.'
          }
          if ($op.schedule_mode -ne 'fixed_start') {
            throw 'Authorized create must use fixed_start scheduling.'
          }
          $startDate = [string]$op.start_date
          if ($startDate -notmatch '^\d{4}-\d{2}-\d{2}$') {
            throw "Invalid fixed start date: $startDate"
          }

          $policy = Get-Content -Raw -Encoding UTF8 novels/death-list/platform-sync/policy.json | ConvertFrom-Json
          if ($policy.timezone -ne 'Asia/Shanghai') { throw 'Unexpected Death List platform timezone.' }
          if (@($policy.schedule.slots).Count -ne 1 -or $policy.schedule.slots[0] -ne '00:00') {
            throw 'Authorized sync expects the active single 00:00 schedule slot.'
          }
          if ($numbers.Count -ne [int]$policy.schedule.group_size) {
            throw "Pending create must contain exactly $($policy.schedule.group_size) chapters."
          }

          $china = [System.TimeZoneInfo]::FindSystemTimeZoneById('China Standard Time')
          $today = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $china).Date
          $scheduledDay = [DateTime]::ParseExact($startDate, 'yyyy-MM-dd', [Globalization.CultureInfo]::InvariantCulture).Date
          if ($scheduledDay -le $today) {
            throw "Scheduled release must be a future Asia/Shanghai date; got $startDate."
          }

          $start = $numbers[0]
          $end = $numbers[-1]
          'has_pending=true' >> $env:GITHUB_OUTPUT
          "operation_id=$($planned.id)" >> $env:GITHUB_OUTPUT
          "chapter_spec=$($planned.chapter_spec)" >> $env:GITHUB_OUTPUT
          "start_chapter=$start" >> $env:GITHUB_OUTPUT
          "end_chapter=$end" >> $env:GITHUB_OUTPUT
          "start_date=$startDate" >> $env:GITHUB_OUTPUT
          Write-Host "Authorized create: $($planned.id), chapters $start-$end, schedule $startDate 00:00 Asia/Shanghai."

      - name: Resolve local Fanqie runtime
        if: steps.plan.outputs.has_pending == 'true'
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Resolved runtime: $runtime"
          "path=$runtime" >> $env:GITHUB_OUTPUT

      - name: Fresh read-only preflight reconciliation
        if: steps.plan.outputs.has_pending == 'true'
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $report = "$env:RUNNER_TEMP\fanqie-preflight-death-list.json"
          python shared/tools/fanqie_compat.py reconcile novels/death-list --runtime "${{ steps.runtime.outputs.path }}" --output $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content -Raw -Encoding UTF8 $report | ConvertFrom-Json

          $start = [int]'${{ steps.plan.outputs.start_chapter }}'
          $end = [int]'${{ steps.plan.outputs.end_chapter }}'
          $expectedPrefixEnd = $start - 1
          $selected = @($start..$end)

          if ($r.book_id -ne '7682312977067822142') { throw 'Book ID mismatch.' }
          if ($r.remote.numbered_item_count -ne $expectedPrefixEnd -or $r.remote.min_chapter -ne 1 -or $r.remote.max_chapter -ne $expectedPrefixEnd) {
            throw "Remote prefix changed: expected exactly 1-$expectedPrefixEnd before sync."
          }
          if (@($r.differences.remote_only_chapters).Count -ne 0) { throw 'Remote-only chapters detected.' }
          if (@($r.differences.title_mismatches).Count -ne 0) { throw 'Title mismatch detected.' }
          if (@($r.differences.position_mismatches).Count -ne 0) { throw 'Position mismatch detected.' }
          if (@($r.differences.duplicate_remote_chapter_numbers.PSObject.Properties).Count -ne 0) { throw 'Duplicate remote chapter numbers detected.' }

          $localOnly = @($r.differences.local_only_chapters | ForEach-Object { [int]$_ })
          foreach ($n in $selected) {
            if ($localOnly -notcontains $n) { throw "Chapter $n is not local-only before create." }
          }
          $unexpectedBefore = @($localOnly | Where-Object { $_ -lt $start })
          if ($unexpectedBefore.Count -ne 0) {
            throw "Unexpected local-only chapters before pending range: $($unexpectedBefore -join ',')"
          }
          Write-Host "Preflight reconciliation PASS: remote is exactly 1-$expectedPrefixEnd and pending create is $start-$end."

      - name: Execute authorized scheduled sync
        if: steps.plan.outputs.has_pending == 'true'
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python shared/tools/fanqie_compat.py sync novels/death-list --runtime "${{ steps.runtime.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify remote after sync
        if: steps.plan.outputs.has_pending == 'true'
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $report = "$env:RUNNER_TEMP\fanqie-postsync-death-list.json"
          python shared/tools/fanqie_compat.py reconcile novels/death-list --runtime "${{ steps.runtime.outputs.path }}" --output $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content -Raw -Encoding UTF8 $report | ConvertFrom-Json

          $start = [int]'${{ steps.plan.outputs.start_chapter }}'
          $end = [int]'${{ steps.plan.outputs.end_chapter }}'
          $expectedSchedule = '${{ steps.plan.outputs.start_date }}T00:00+08:00'

          if ($r.remote.numbered_item_count -ne $end -or $r.remote.min_chapter -ne 1 -or $r.remote.max_chapter -ne $end) {
            throw "Post-sync remote prefix is not exactly 1-$end."
          }
          if (@($r.differences.remote_only_chapters).Count -ne 0) { throw 'Remote-only chapters detected after sync.' }
          if (@($r.differences.title_mismatches).Count -ne 0) { throw 'Title mismatch detected after sync.' }
          if (@($r.differences.position_mismatches).Count -ne 0) { throw 'Position mismatch detected after sync.' }
          if (@($r.differences.duplicate_remote_chapter_numbers.PSObject.Properties).Count -ne 0) { throw 'Duplicate remote chapter numbers detected after sync.' }

          $remainingLocalOnly = @($r.differences.local_only_chapters | ForEach-Object { [int]$_ } | Where-Object { $_ -le $end })
          if ($remainingLocalOnly.Count -ne 0) {
            throw "Created range still local-only after sync: $($remainingLocalOnly -join ',')"
          }

          $allowedStatuses = @('scheduled','reviewing')
          foreach ($n in $start..$end) {
            $item = @($r.remote_items | Where-Object { $_.chapter_number -eq $n })
            if ($item.Count -ne 1) { throw "Chapter $n missing or duplicated after sync." }
            if ($allowedStatuses -notcontains $item[0].status) { throw "Chapter $n has unexpected post-sync status: $($item[0].status)" }
            if ($item[0].scheduled_at -ne $expectedSchedule) { throw "Chapter $n has unexpected schedule: $($item[0].scheduled_at)" }
          }
          Write-Host "Post-sync verification PASS: chapters $start-$end exist once and retain $expectedSchedule."

      - name: Persist synchronization ledgers
        if: always()
        shell: powershell
        run: |
          $paths = @(git diff --name-only | Where-Object { $_ -match '^novels/death-list/platform-sync/(queue|sync-state)\.json$' })
          if ($paths.Count -eq 0) {
            Write-Host 'No queue/sync-state changes to persist.'
            exit 0
          }
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          foreach ($path in $paths) { git add -- $path }
          git commit -m "chore(fanqie): record self-hosted sync result"
          git pull --rebase origin main
          git push origin HEAD:main
