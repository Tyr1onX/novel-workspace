# One-shot trigger for the first production schema-v2 analytics snapshot.
name: Fanqie Data Probe

on:
  push:
    branches:
      - main
    paths:
      - "shared/tools/fanqie_data_probe.py"
      - ".github/workflows/fanqie-data-probe.yml"
  workflow_dispatch:

concurrency:
  group: fanqie-data-probe
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile read-only probe
        run: python -m py_compile shared/tools/fanqie_data_probe.py

  data_probe:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fanqie-data-probe]')
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Read and persist sanitized author analytics
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $projects = @(python shared/tools/fanqie_projects.py list)
          if ($projects.Count -eq 0) { throw "No Fanqie projects configured." }
          python shared/tools/fanqie_data_probe.py @projects --runtime "${{ steps.runtime.outputs.path }}" --write-snapshots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit analytics snapshots
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- novels
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No analytics changes to commit."
            exit 0
          }
          git commit -m "data(fanqie): record sanitized analytics snapshot [skip ci]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
