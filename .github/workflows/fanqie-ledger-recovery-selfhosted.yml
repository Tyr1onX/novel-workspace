name: Fanqie Ledger Recovery Selfhosted

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fanqie-ledger-recovery-selfhosted.yml"
  workflow_dispatch:

concurrency:
  group: fanqie-ledger-recovery-selfhosted
  cancel-in-progress: false

jobs:
  recover-death-list-50-54:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        shell: powershell
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Resolve Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Verify remote creation without mutation
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $report = "$env:RUNNER_TEMP\fanqie-ledger-recovery-50-54.json"
          python shared/tools/fanqie_compat.py reconcile novels/death-list --runtime "${{ steps.runtime.outputs.path }}" --output $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content -Raw -Encoding UTF8 $report | ConvertFrom-Json
          if ($r.book_id -ne '7682312977067822142') { throw 'Book ID mismatch.' }
          if ($r.remote.numbered_item_count -ne 54 -or $r.remote.min_chapter -ne 1 -or $r.remote.max_chapter -ne 54) {
            throw 'Remote prefix is not exactly 1-54; ledger recovery aborted.'
          }
          if (@($r.differences.remote_only_chapters).Count -ne 0) { throw 'Remote-only chapters detected.' }
          if (@($r.differences.title_mismatches).Count -ne 0) { throw 'Title mismatch detected.' }
          if (@($r.differences.position_mismatches).Count -ne 0) { throw 'Position mismatch detected.' }
          if (@($r.differences.duplicate_remote_chapter_numbers.PSObject.Properties).Count -ne 0) { throw 'Duplicate chapter numbers detected.' }
          $expectedLocalOnly = @(55,56,57,58,59)
          $actualLocalOnly = @($r.differences.local_only_chapters)
          if (($actualLocalOnly -join ',') -ne ($expectedLocalOnly -join ',')) {
            throw "Unexpected local-only set: $($actualLocalOnly -join ',')"
          }
          foreach ($n in 50..54) {
            $item = @($r.remote_items | Where-Object { $_.chapter_number -eq $n })
            if ($item.Count -ne 1) { throw "Chapter $n missing or duplicated." }
            if (@('scheduled','reviewing') -notcontains $item[0].status) {
              throw "Chapter $n has unexpected state: $($item[0].status)"
            }
            if ($item[0].scheduled_at -ne '2026-09-15T00:00+08:00') {
              throw "Chapter $n has unexpected schedule: $($item[0].scheduled_at)"
            }
          }
          Write-Host 'Remote verification PASS: 50-54 exist exactly once; scheduled/reviewing states retain 2026-09-15 00:00 +08:00.'
      - name: Recover repository queue and sync state
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          @'
          import datetime as dt
          import json
          import sys
          from pathlib import Path

          tools = Path('shared/tools').resolve()
          sys.path.insert(0, str(tools))
          import fanqie_compat
          import fanqie_sync

          fanqie_compat.install_compat()
          novel = Path('novels/death-list').resolve()
          config, policy, queue, chapters = fanqie_sync.load_model(novel)
          if config.get('book_id') != '7682312977067822142':
              raise SystemExit('book id mismatch')

          op_id = 'death-list-create-050-054-20260907'
          matches = [op for op in queue.get('operations', []) if op.get('id') == op_id]
          if len(matches) != 1:
              raise SystemExit('expected exactly one 50-54 queue operation')
          op = matches[0]
          if op.get('action') != 'create' or op.get('chapters') != '50-54':
              raise SystemExit('unexpected 50-54 operation shape')
          if op.get('authorized') is not True or (op.get('audit') or {}).get('status') != 'passed':
              raise SystemExit('operation is not authorized/audit-passed')

          completed_at = '2026-09-10T08:21:26+00:00'
          op['status'] = 'completed'
          op['completed_at'] = completed_at
          audit = op.setdefault('audit', {})
          audit['sync_run'] = '34454457858'
          audit['sync_job'] = '102797492494'
          audit['post_sync_remote_prefix'] = '1-54'
          audit['post_sync_status'] = '29 published; 24 scheduled; 1 reviewing'
          audit['post_sync_note'] = 'Chapters 50-53 scheduled for 2026-09-15 00:00 Asia/Shanghai; chapter 54 is reviewing and retains the same scheduled_at. Fresh post-sync reconciliation found no remote-only chapters, duplicate numbers, title mismatches, or position mismatches.'
          queue['updated_at'] = completed_at

          sync_dir = novel / 'platform-sync'
          queue_path = sync_dir / 'queue.json'
          state_path = sync_dir / 'sync-state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state.setdefault('chapters', {})
          for n in range(50, 55):
              ch = chapters[n]
              state['chapters'][str(n)] = {
                  'local_sha256': ch.sha256,
                  'last_action': 'create',
                  'last_synced_at': completed_at,
                  'queue_operation_id': op_id,
              }
          state['last_sync_at'] = completed_at

          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Recovered queue/state for chapters 50-54 from verified remote result.')
          for n in range(50, 55):
              print(n, state['chapters'][str(n)]['local_sha256'])
          '@ | python -
      - name: Persist recovered ledgers
        shell: powershell
        run: |
          git add novels/death-list/platform-sync/queue.json novels/death-list/platform-sync/sync-state.json
          if ((git diff --cached --name-only).Count -eq 0) { throw 'No ledger changes produced.' }
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          git commit -m "chore(fanqie): record self-hosted sync result"
          git pull --rebase origin main
          git push origin HEAD:main
