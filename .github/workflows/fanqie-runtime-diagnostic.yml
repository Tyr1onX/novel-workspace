name: Fanqie Runtime Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fanqie-runtime-diagnostic.yml"

jobs:
  inspect_runtime:
    if: github.event.pull_request.head.ref == 'fix/fanqie-runtime-recovery'
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Print relevant pinned runtime source
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          @'
          from pathlib import Path
          import re
          import sys

          path = Path(r"${{ steps.runtime.outputs.path }}") / "fanqie_upload.py"
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          patterns = [
              r"发布设置",
              r"wait_for_selector",
              r"auto.?continue",
              r"compute_schedule",
              r"scheduled",
              r"chapter.*list",
          ]
          hits = set()
          for i, line in enumerate(lines):
              if any(re.search(p, line, re.I) for p in patterns):
                  hits.add(i)
          windows = []
          for i in sorted(hits):
              start = max(0, i - 18)
              end = min(len(lines), i + 24)
              if windows and start <= windows[-1][1]:
                  windows[-1] = (windows[-1][0], max(windows[-1][1], end))
              else:
                  windows.append((start, end))
          print(f"runtime={path}")
          for start, end in windows:
              print(f"\n--- lines {start + 1}-{end} ---")
              for n in range(start, end):
                  print(f"{n + 1:05d}: {lines[n]}")
          '@ | python -
