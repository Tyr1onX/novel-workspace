name: Fanqie Sync

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "novels/**/chapters/**"
      - "novels/**/platform-sync/config.json"
      - "novels/**/platform-sync/policy.json"
      - "novels/**/platform-sync/queue.json"
      - "novels/**/platform-sync/one-shot.json"
      - "shared/tools/fanqie_sync.py"
      - "shared/tools/test_fanqie_sync.py"
      - "shared/tools/fanqie_probe.py"
      - "shared/tools/test_fanqie_probe.py"
      - "shared/tools/fanqie_reconcile.py"
      - "shared/tools/fanqie_publish_now.py"
      - "shared/tools/fanqie_projects.py"
      - ".github/workflows/fanqie-sync.yml"
  push:
    branches:
      - main
    paths:
      - "novels/**/chapters/**"
      - "novels/**/platform-sync/config.json"
      - "novels/**/platform-sync/policy.json"
      - "novels/**/platform-sync/queue.json"
      - "novels/**/platform-sync/one-shot.json"
      - "shared/tools/fanqie_sync.py"
      - "shared/tools/test_fanqie_sync.py"
      - "shared/tools/fanqie_probe.py"
      - "shared/tools/test_fanqie_probe.py"
      - "shared/tools/fanqie_reconcile.py"
      - "shared/tools/fanqie_publish_now.py"
      - "shared/tools/fanqie_projects.py"
      - ".github/workflows/fanqie-sync.yml"

concurrency:
  group: fanqie-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      any_sync_enabled: ${{ steps.gate.outputs.any_sync_enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Fanqie sync unit tests
        run: python -m unittest shared/tools/test_fanqie_sync.py shared/tools/test_fanqie_probe.py
      - name: Compile Fanqie helpers
        run: python -m py_compile shared/tools/fanqie_reconcile.py shared/tools/fanqie_publish_now.py shared/tools/fanqie_projects.py
      - name: Validate every configured Fanqie novel
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(python shared/tools/fanqie_projects.py list)
          if (( ${#projects[@]} == 0 )); then
            echo "No Fanqie-configured novels found."
            exit 1
          fi
          for project in "${projects[@]}"; do
            echo "=== validate: $project ==="
            python shared/tools/fanqie_sync.py validate "$project"
            python shared/tools/fanqie_sync.py plan "$project"
          done
      - name: Read repository-wide sync gate
        id: gate
        shell: bash
        run: |
          value="$(python shared/tools/fanqie_projects.py any-enabled)"
          echo "any_sync_enabled=$value" >> "$GITHUB_OUTPUT"
          echo "any_sync_enabled=$value"

  probe:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.validate.outputs.any_sync_enabled == 'true' || contains(github.event.head_commit.message, '[fanqie-probe]'))
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Resolved runtime: $runtime"
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Probe configured books
        shell: powershell
        env:
          PYTHONUTF8: "1"
          PROBE_ALL: ${{ contains(github.event.head_commit.message, '[fanqie-probe]') }}
        run: |
          if ($env:PROBE_ALL -eq "true") {
            $projects = @(python shared/tools/fanqie_projects.py list)
          } else {
            $projects = @(python shared/tools/fanqie_projects.py enabled)
          }
          foreach ($project in $projects) {
            if (-not $project) { continue }
            Write-Host "=== probe: $project ==="
            python shared/tools/fanqie_probe.py probe $project --runtime "${{ steps.runtime.outputs.path }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  reconcile:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[fanqie-reconcile]')
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Resolved runtime: $runtime"
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Reconcile every configured Fanqie novel
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $projects = @(python shared/tools/fanqie_projects.py list)
          foreach ($project in $projects) {
            if (-not $project) { continue }
            $slug = Split-Path $project -Leaf
            Write-Host "=== reconcile: $project ==="
            python shared/tools/fanqie_reconcile.py $project --runtime "${{ steps.runtime.outputs.path }}" --output "$env:RUNNER_TEMP\fanqie-reconcile-$slug.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  publish_now:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[fanqie-publish-now]')
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main before platform mutation
        shell: powershell
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Resolved runtime: $runtime"
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Execute pending authorized publish-now requests
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $requests = @(python shared/tools/fanqie_projects.py pending-one-shots)
          if ($requests.Count -eq 0) {
            Write-Host "No pending authorized publish-now requests."
            exit 0
          }
          foreach ($entry in $requests) {
            if (-not $entry) { continue }
            $parts = $entry -split '\|', 2
            $project = $parts[0]
            $request = $parts[1]
            Write-Host "=== publish now: $project ==="
            python shared/tools/fanqie_publish_now.py $project --runtime "${{ steps.runtime.outputs.path }}" --request $request
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Persist one-shot results
        shell: powershell
        run: |
          $paths = @(git diff --name-only | Where-Object { $_ -match '^novels/[^/]+/platform-sync/one-shot\.json$' })
          if ($paths.Count -eq 0) {
            Write-Host "No one-shot state changes to commit."
            exit 0
          }
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          foreach ($path in $paths) { git add -- $path }
          git commit -m "chore(fanqie): record publish-now result"
          git pull --rebase origin main
          git push origin HEAD:main

  publish:
    needs: [validate, probe]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.any_sync_enabled == 'true' && needs.probe.result == 'success'
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main before platform mutation
        shell: powershell
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Resolved runtime: $runtime"
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Execute authorized operations for enabled novels
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $projects = @(python shared/tools/fanqie_projects.py enabled)
          foreach ($project in $projects) {
            if (-not $project) { continue }
            Write-Host "=== sync: $project ==="
            python shared/tools/fanqie_sync.py sync $project --runtime "${{ steps.runtime.outputs.path }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Persist synchronization ledgers
        shell: powershell
        run: |
          $paths = @(git diff --name-only | Where-Object { $_ -match '^novels/[^/]+/platform-sync/(queue|sync-state)\.json$' })
          if ($paths.Count -eq 0) {
            Write-Host "No sync-state changes to commit."
            exit 0
          }
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          foreach ($path in $paths) { git add -- $path }
          git commit -m "chore(fanqie): record completed sync operations"
          git pull --rebase origin main
          git push origin HEAD:main
