# bulk inventory prepublish [fanqie-reconcile]
name: Fanqie Sync

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "novels/**/chapters/**"
      - "novels/**/platform-sync/config.json"
      - "novels/**/platform-sync/policy.json"
      - "novels/**/platform-sync/queue.json"
      - "novels/**/platform-sync/one-shot.json"
      - "shared/tools/bootstrap_fanqie_sync_macos.sh"
      - "shared/tools/fanqie_sync.py"
      - "shared/tools/test_fanqie_sync.py"
      - "shared/tools/fanqie_probe.py"
      - "shared/tools/test_fanqie_probe.py"
      - "shared/tools/fanqie_reconcile.py"
      - "shared/tools/fanqie_publish_now.py"
      - "shared/tools/fanqie_projects.py"
      - "shared/tools/fanqie_compat.py"
      - "shared/tools/fanqie_runtime_bridge.py"
      - ".github/workflows/fanqie-sync.yml"
  push:
    branches:
      - main
    paths:
      - "novels/**/chapters/**"
      - "novels/**/platform-sync/config.json"
      - "novels/**/platform-sync/policy.json"
      - "novels/**/platform-sync/queue.json"
      - "novels/**/platform-sync/one-shot.json"
      - "shared/tools/bootstrap_fanqie_sync_macos.sh"
      - "shared/tools/fanqie_sync.py"
      - "shared/tools/test_fanqie_sync.py"
      - "shared/tools/fanqie_probe.py"
      - "shared/tools/test_fanqie_probe.py"
      - "shared/tools/fanqie_reconcile.py"
      - "shared/tools/fanqie_publish_now.py"
      - "shared/tools/fanqie_projects.py"
      - "shared/tools/fanqie_compat.py"
      - "shared/tools/fanqie_runtime_bridge.py"
      - ".github/workflows/fanqie-sync.yml"

concurrency:
  group: fanqie-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      any_sync_enabled: ${{ steps.gate.outputs.any_sync_enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Fanqie sync unit tests
        run: python -m unittest shared/tools/test_fanqie_sync.py shared/tools/test_fanqie_probe.py
      - name: Compile Fanqie helpers
        run: python -m py_compile shared/tools/fanqie_reconcile.py shared/tools/fanqie_publish_now.py shared/tools/fanqie_projects.py shared/tools/fanqie_compat.py shared/tools/fanqie_runtime_bridge.py
      - name: Validate every configured Fanqie novel
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(python shared/tools/fanqie_projects.py list)
          if (( ${#projects[@]} == 0 )); then
            echo "No Fanqie-configured novels found."
            exit 1
          fi
          for project in "${projects[@]}"; do
            echo "=== validate: $project ==="
            python shared/tools/fanqie_compat.py validate "$project"
            python shared/tools/fanqie_compat.py plan "$project"
          done
      - name: Read repository-wide sync gate
        id: gate
        shell: bash
        run: |
          value="$(python shared/tools/fanqie_projects.py any-enabled)"
          echo "any_sync_enabled=$value" >> "$GITHUB_OUTPUT"
          echo "any_sync_enabled=$value"

  probe:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.validate.outputs.any_sync_enabled == 'true' || contains(github.event.head_commit.message, '[fanqie-probe]'))
    runs-on: [self-hosted, macOS, fanqie]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use local Fanqie Python
        shell: bash
        run: |
          set -euo pipefail
          venv_bin="$HOME/.novel-workspace/fanqie-venv/bin"
          if [[ ! -x "$venv_bin/python" ]]; then
            echo "Missing Fanqie Python environment: $venv_bin/python"
            echo "Run: bash shared/tools/bootstrap_fanqie_sync_macos.sh"
            exit 1
          fi
          echo "$venv_bin" >> "$GITHUB_PATH"
          "$venv_bin/python" --version
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(python shared/tools/fanqie_probe.py resolve-runtime)"
          echo "Resolved runtime: $runtime"
          echo "path=$runtime" >> "$GITHUB_OUTPUT"
      - name: Probe configured books
        shell: bash
        env:
          PYTHONUTF8: "1"
          PROBE_ALL: ${{ contains(github.event.head_commit.message, '[fanqie-probe]') }}
        run: |
          set -euo pipefail
          if [[ "$PROBE_ALL" == "true" ]]; then
            mode="list"
          else
            mode="enabled"
          fi
          while IFS= read -r project; do
            [[ -n "$project" ]] || continue
            echo "=== probe: $project ==="
            python shared/tools/fanqie_probe.py probe "$project" --runtime "${{ steps.runtime.outputs.path }}"
          done < <(python shared/tools/fanqie_projects.py "$mode")

  reconcile:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[fanqie-reconcile]')
    runs-on: [self-hosted, macOS, fanqie]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use local Fanqie Python
        shell: bash
        run: |
          set -euo pipefail
          venv_bin="$HOME/.novel-workspace/fanqie-venv/bin"
          if [[ ! -x "$venv_bin/python" ]]; then
            echo "Missing Fanqie Python environment: $venv_bin/python"
            echo "Run: bash shared/tools/bootstrap_fanqie_sync_macos.sh"
            exit 1
          fi
          echo "$venv_bin" >> "$GITHUB_PATH"
          "$venv_bin/python" --version
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(python shared/tools/fanqie_probe.py resolve-runtime)"
          echo "Resolved runtime: $runtime"
          echo "path=$runtime" >> "$GITHUB_OUTPUT"
      - name: Reconcile every configured Fanqie novel
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            [[ -n "$project" ]] || continue
            slug="${project##*/}"
            echo "=== reconcile: $project ==="
            python shared/tools/fanqie_compat.py reconcile "$project"               --runtime "${{ steps.runtime.outputs.path }}"               --output "$RUNNER_TEMP/fanqie-reconcile-$slug.json"
          done < <(python shared/tools/fanqie_projects.py list)

  publish_now:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[fanqie-publish-now]')
    runs-on: [self-hosted, macOS, fanqie]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use local Fanqie Python
        shell: bash
        run: |
          set -euo pipefail
          venv_bin="$HOME/.novel-workspace/fanqie-venv/bin"
          if [[ ! -x "$venv_bin/python" ]]; then
            echo "Missing Fanqie Python environment: $venv_bin/python"
            echo "Run: bash shared/tools/bootstrap_fanqie_sync_macos.sh"
            exit 1
          fi
          echo "$venv_bin" >> "$GITHUB_PATH"
          "$venv_bin/python" --version
      - name: Rebase to latest main before platform mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(python shared/tools/fanqie_probe.py resolve-runtime)"
          echo "Resolved runtime: $runtime"
          echo "path=$runtime" >> "$GITHUB_OUTPUT"
      - name: Execute pending authorized publish-now requests
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r entry; do
            [[ -n "$entry" ]] || continue
            found=true
            IFS='|' read -r project request <<< "$entry"
            echo "=== publish now: $project ==="
            python shared/tools/fanqie_compat.py publish-now "$project"               --runtime "${{ steps.runtime.outputs.path }}"               --request "$request"
          done < <(python shared/tools/fanqie_projects.py pending-one-shots)
          if [[ "$found" == "false" ]]; then
            echo "No pending authorized publish-now requests."
          fi
      - name: Persist one-shot results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && paths+=("$path")
          done < <(git diff --name-only | grep -E '^novels/[^/]+/platform-sync/one-shot\.json$' || true)
          if (( ${#paths[@]} == 0 )); then
            echo "No one-shot state changes to commit."
            exit 0
          fi
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "chore(fanqie): record publish-now result"
          git pull --rebase origin main
          git push origin HEAD:main

  publish:
    needs: [validate, probe]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.any_sync_enabled == 'true' && needs.probe.result == 'success'
    runs-on: [self-hosted, macOS, fanqie]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use local Fanqie Python
        shell: bash
        run: |
          set -euo pipefail
          venv_bin="$HOME/.novel-workspace/fanqie-venv/bin"
          if [[ ! -x "$venv_bin/python" ]]; then
            echo "Missing Fanqie Python environment: $venv_bin/python"
            echo "Run: bash shared/tools/bootstrap_fanqie_sync_macos.sh"
            exit 1
          fi
          echo "$venv_bin" >> "$GITHUB_PATH"
          "$venv_bin/python" --version
      - name: Rebase to latest main before platform mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(python shared/tools/fanqie_probe.py resolve-runtime)"
          echo "Resolved runtime: $runtime"
          echo "path=$runtime" >> "$GITHUB_OUTPUT"
      - name: Execute authorized operations for enabled novels
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            [[ -n "$project" ]] || continue
            echo "=== sync: $project ==="
            python shared/tools/fanqie_compat.py sync "$project" --runtime "${{ steps.runtime.outputs.path }}"
          done < <(python shared/tools/fanqie_projects.py enabled)
      - name: Persist synchronization ledgers
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && paths+=("$path")
          done < <(git diff --name-only | grep -E '^novels/[^/]+/platform-sync/(queue|sync-state)\.json$' || true)
          if (( ${#paths[@]} == 0 )); then
            echo "No sync-state changes to commit."
            exit 0
          fi
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "chore(fanqie): record completed sync operations"
          git pull --rebase origin main
          git push origin HEAD:main
