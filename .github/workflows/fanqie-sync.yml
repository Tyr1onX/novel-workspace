name: Fanqie Sync

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "novels/**/chapters/**"
      - "novels/**/platform-sync/config.json"
      - "novels/**/platform-sync/policy.json"
      - "novels/**/platform-sync/queue.json"
      - "shared/tools/fanqie_sync.py"
      - "shared/tools/test_fanqie_sync.py"
      - "shared/tools/fanqie_probe.py"
      - "shared/tools/test_fanqie_probe.py"
      - ".github/workflows/fanqie-sync.yml"
  push:
    branches:
      - main
    paths:
      - "novels/**/chapters/**"
      - "novels/**/platform-sync/config.json"
      - "novels/**/platform-sync/policy.json"
      - "novels/**/platform-sync/queue.json"
      - "shared/tools/fanqie_sync.py"
      - "shared/tools/test_fanqie_sync.py"
      - "shared/tools/fanqie_probe.py"
      - "shared/tools/test_fanqie_probe.py"
      - ".github/workflows/fanqie-sync.yml"

concurrency:
  group: fanqie-sync-endless-rail
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sync_enabled: ${{ steps.gate.outputs.sync_enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Fanqie sync unit tests
        run: python -m unittest shared/tools/test_fanqie_sync.py shared/tools/test_fanqie_probe.py
      - name: Validate publishing model
        run: python shared/tools/fanqie_sync.py validate novels/endless-rail
      - name: Show authorized plan
        run: python shared/tools/fanqie_sync.py plan novels/endless-rail
      - name: Read repository sync gate
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("novels/endless-rail/platform-sync/config.json").read_text(encoding="utf-8"))
          value = "true" if config.get("sync_enabled") is True else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"sync_enabled={value}\n")
          print(f"sync_enabled={value}")
          PY

  probe:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.validate.outputs.sync_enabled == 'true' || contains(github.event.head_commit.message, '[fanqie-probe]'))
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve local Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Resolved runtime: $runtime"
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Probe saved Fanqie login and target book
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python shared/tools/fanqie_probe.py probe novels/endless-rail --runtime "${{ steps.runtime.outputs.path }}"

  publish:
    needs: [validate, probe]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.sync_enabled == 'true' && needs.probe.result == 'success'
    runs-on: [self-hosted, windows, fanqie]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase to latest main before platform mutation
        shell: powershell
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Resolve local Fanqie runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Resolved runtime: $runtime"
          "path=$runtime" >> $env:GITHUB_OUTPUT

      - name: Execute authorized Fanqie operations
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python shared/tools/fanqie_sync.py sync novels/endless-rail --runtime "${{ steps.runtime.outputs.path }}"

      - name: Persist synchronization ledger
        shell: powershell
        run: |
          $paths = @(
            "novels/endless-rail/platform-sync/queue.json",
            "novels/endless-rail/platform-sync/sync-state.json"
          )
          $changed = git status --porcelain -- $paths
          if (-not $changed) {
            Write-Host "No sync-state changes to commit."
            exit 0
          }
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          git add -- $paths
          git commit -m "chore(fanqie): record completed sync operations"
          git pull --rebase origin main
          git push origin HEAD:main
