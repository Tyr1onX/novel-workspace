name: One-shot meta leak repair

on:
  push:
    branches:
      - fix/endless-rail-meta-leaks

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/endless-rail-meta-leaks
      - name: Apply exact repairs
        run: python shared/tools/repair_endless_rail_meta_leaks.py
      - name: Commit repaired documentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No documentation diff produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/RULES.md novels/endless-rail/docs/audit-087-106.md
          git commit -m "docs: wire meta-narrative gate into audit flow"
          git push origin HEAD:fix/endless-rail-meta-leaks
