name: Walk 136-140 Exact Quality Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/walk-136-140-exact-quality-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Protected continuity invariants
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/check_rebuild_invariants.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact-range mandatory fiction guards
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $files = @(
            "novels/walk-to-earn/chapters/chapter-136.md",
            "novels/walk-to-earn/chapters/chapter-137.md",
            "novels/walk-to-earn/chapters/chapter-138.md",
            "novels/walk-to-earn/chapters/chapter-139.md",
            "novels/walk-to-earn/chapters/chapter-140.md"
          )
          python shared/tools/novel_gate.py @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact-range chapter length floor
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/audit_chapter_lengths.py --start 136 --end 140 --minimum 2000 --fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact five-chapter release floor
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/check_release_floor.py --start 136 --end 140 --minimum 9999 --normal 5 --maximum 5 --require-all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact-range repetition mechanics and numeric audit
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/audit_release_range_136_140.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
