name: Walk 141-145 Exact Quality Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/walk-141-145-exact-quality-audit.yml"
      - "novels/walk-to-earn/chapters/chapter-141.md"
      - "novels/walk-to-earn/chapters/chapter-142.md"
      - "novels/walk-to-earn/chapters/chapter-143.md"
      - "novels/walk-to-earn/chapters/chapter-144.md"
      - "novels/walk-to-earn/chapters/chapter-145.md"
      - "novels/walk-to-earn/tools/audit_release_range_141_145.py"
      - "novels/walk-to-earn/tools/check_rebuild_invariants.py"
      - "shared/tools/novel_gate.py"
      - "shared/tools/narrative_guard.py"
      - "shared/tools/dialogue_guard.py"
      - "shared/tools/humanizer_guard.py"
      - "shared/tools/prose_guard.py"
      - "shared/tools/meta_narrative_guard.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Protected continuity invariants
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/check_rebuild_invariants.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact-range mandatory fiction guards
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $files = @(
            "novels/walk-to-earn/chapters/chapter-141.md",
            "novels/walk-to-earn/chapters/chapter-142.md",
            "novels/walk-to-earn/chapters/chapter-143.md",
            "novels/walk-to-earn/chapters/chapter-144.md",
            "novels/walk-to-earn/chapters/chapter-145.md"
          )
          python shared/tools/novel_gate.py @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact-range chapter length floor
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/audit_chapter_lengths.py --start 141 --end 145 --minimum 2000 --fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact five-chapter release floor
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/check_release_floor.py --start 141 --end 145 --minimum 9999 --normal 5 --maximum 5 --require-all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exact-range repetition mechanics and numeric audit
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/audit_release_range_141_145.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
