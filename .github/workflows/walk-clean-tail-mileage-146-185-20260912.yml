name: Walk Clean Tail And Mileage 146-185

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/walk-clean-tail-mileage-146-185-20260912.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair only chapters 146-185
        shell: powershell
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python novels/walk-to-earn/tools/cleanup_tail_mileage_146_185_20260912.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit cleanup only
        shell: powershell
        run: |
          git config user.name "fanqie-sync-bot"
          git config user.email "fanqie-sync-bot@users.noreply.github.com"
          git add novels/walk-to-earn/chapters/chapter-14*.md novels/walk-to-earn/chapters/chapter-15*.md novels/walk-to-earn/chapters/chapter-16*.md novels/walk-to-earn/chapters/chapter-17*.md novels/walk-to-earn/chapters/chapter-18*.md novels/walk-to-earn/audits/tail-mileage-cleanup-146-185-20260912.md
          if (git diff --cached --quiet) {
            Write-Host "No cleanup changes to commit."
            exit 0
          }
          git commit -m "fix(walk-to-earn): clean repeated tails and mileage 146-185 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
