name: Walk Meta Ref Repair 20260910

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/walk-meta-ref-repair-20260910.yml"
      - "novels/walk-to-earn/tools/repair_meta_refs_20260910.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair body chapter-number references
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/repair_meta_refs_20260910.py --start 113 --end 185 --write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit repair changes
        shell: powershell
        run: |
          $changed = @(git status --porcelain -- novels/walk-to-earn/chapters novels/walk-to-earn/audits/meta-ref-repair-20260910.md)
          if ($changed.Count -eq 0) {
            Write-Host "No meta-reference repair changes."
            exit 0
          }
          git config user.name "walk-quality-bot"
          git config user.email "walk-quality-bot@users.noreply.github.com"
          git add novels/walk-to-earn/chapters novels/walk-to-earn/audits/meta-ref-repair-20260910.md
          git commit -m "chore(walk): repair body chapter references"
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
