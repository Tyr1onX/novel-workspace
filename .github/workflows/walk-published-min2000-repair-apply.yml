name: Walk Published Min2000 Repair Apply

on:
  push:
    branches:
      - audit/walk-repair-published-min2000
    paths:
      - "novels/walk-to-earn/tools/apply_published_min2000_repairs.py"
      - "novels/walk-to-earn/tools/apply_published_min2000_repairs_v2.py"
      - "novels/walk-to-earn/tools/apply_published_min2000_repairs_v3.py"
      - "novels/walk-to-earn/tools/apply_published_min2000_repairs_v4.py"
      - "novels/walk-to-earn/tools/apply_published_min2000_repairs_v5.py"
      - ".github/workflows/walk-published-min2000-repair-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/walk-repair-published-min2000
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply complete substantive repair pass
        run: python novels/walk-to-earn/tools/apply_published_min2000_repairs_v5.py
      - name: Verify all published chapters meet 2000 floor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('novels/walk-to-earn/chapters')
          short = []
          for n in range(1, 44):
              p = root / f'chapter-{n:03d}.md'
              raw = p.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
              lines = raw.split('\n')
              first = next(i for i, line in enumerate(lines) if line.strip())
              body = '\n'.join(lines[first+1:]).strip()
              chars = len(re.sub(r'\s', '', body))
              print(f'ch{n}: {chars}')
              if chars < 2000:
                  short.append((n, chars))
          if short:
              raise SystemExit(f'short chapters remain: {short}')
          print('ALL_PUBLISHED_CHAPTERS_MEET_FLOOR')
          PY
      - name: Commit repaired chapters
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- novels/walk-to-earn/chapters/)" ]]; then
            echo "No chapter changes."
            exit 0
          fi
          git config user.name "walk-repair-bot"
          git config user.email "walk-repair-bot@users.noreply.github.com"
          git add novels/walk-to-earn/chapters/
          git commit -m "fix(walk): expand published short chapters above 2000"
          git pull --rebase origin audit/walk-repair-published-min2000
          git push origin HEAD:audit/walk-repair-published-min2000
