name: Walk Published Min2000 Repair Cleanup

on:
  push:
    branches:
      - audit/walk-repair-published-min2000
    paths:
      - "novels/walk-to-earn/tools/finalize_published_min2000_repair.py"
      - ".github/workflows/walk-published-min2000-repair-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/walk-repair-published-min2000
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove internal repair markers
        run: python novels/walk-to-earn/tools/finalize_published_min2000_repair.py
      - name: Recheck all published chapter lengths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('novels/walk-to-earn/chapters')
          short = []
          leaked = []
          for n in range(1, 44):
              p = root / f'chapter-{n:03d}.md'
              raw = p.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
              if '<!-- min2000-repair-' in raw:
                  leaked.append(n)
              lines = raw.split('\n')
              first = next(i for i, line in enumerate(lines) if line.strip())
              body = '\n'.join(lines[first+1:]).strip()
              chars = len(re.sub(r'\s', '', body))
              if chars < 2000:
                  short.append((n, chars))
          if short or leaked:
              raise SystemExit(f'short={short} leaked_markers={leaked}')
          print('CLEAN_AND_ALL_PUBLISHED_CHAPTERS_MEET_FLOOR')
          PY
      - name: Remove temporary repair machinery and commit final branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/walk-published-min2000-repair-apply.yml \
            .github/workflows/walk-published-min2000-repair-cleanup.yml \
            novels/walk-to-earn/audits/.repair-branch-marker \
            novels/walk-to-earn/tools/apply_published_min2000_repairs.py \
            novels/walk-to-earn/tools/apply_published_min2000_repairs_v2.py \
            novels/walk-to-earn/tools/apply_published_min2000_repairs_v3.py \
            novels/walk-to-earn/tools/apply_published_min2000_repairs_v4.py \
            novels/walk-to-earn/tools/apply_published_min2000_repairs_v5.py \
            novels/walk-to-earn/tools/finalize_published_min2000_repair.py
          git config user.name "walk-repair-bot"
          git config user.email "walk-repair-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(walk): finalize published min2000 repair branch"
          git pull --rebase origin audit/walk-repair-published-min2000
          git push origin HEAD:audit/walk-repair-published-min2000
