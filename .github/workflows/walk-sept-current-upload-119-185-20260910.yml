name: Walk September Current Upload 119-185
# rerun: 20260910-126-185-python-topup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/walk-sept-current-upload-119-185-20260910.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final local topup for 126 and 129
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          updates = [
              (
                  Path('novels/walk-to-earn/chapters/chapter-126.md'),
                  '等门开不是空耗',
                  '等门开不是空耗。周航后来把这句话念了两遍，像给自己找台阶，也像真想明白了。沈川没有拆穿他，只把纸巾递过去。早到、等候、重新确认尺寸，这些看起来不产生结果的时间，反而让他们少买错一件东西。系统不会给等待单独结算，可生活会。',
              ),
              (
                  Path('novels/walk-to-earn/chapters/chapter-129.md'),
                  '三十块买到的是不添乱',
                  '三十块买到的是不添乱。周航后来坐在新椅子上承认，如果那箱东西是他们硬抬上来的，他大概会在拧第一颗螺丝时就开始后悔。沈川把这句话记住了。余量有时候不是多做什么，而是少制造一个需要忍的麻烦。',
              ),
          ]
          for path, marker, text in updates:
              body = path.read_text(encoding='utf-8')
              if marker not in body:
                  path.write_text(body.rstrip() + '\n\n' + text + '\n', encoding='utf-8')
          PY
          git config user.name "walk-recovery-bot"
          git config user.email "walk-recovery-bot@users.noreply.github.com"
          git add novels/walk-to-earn/chapters/chapter-126.md novels/walk-to-earn/chapters/chapter-129.md
          if ! git diff --cached --quiet; then
            git commit -m "fix(walk): final length topup for chapters 126 and 129 [skip ci]"
            git push origin HEAD:main
          fi
      - name: Validate current chapters only
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/audit_chapter_lengths.py --minimum 2000 --fail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = python shared/tools/fanqie_probe.py resolve-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$runtime" >> $env:GITHUB_OUTPUT
      - name: Probe book
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python shared/tools/fanqie_probe.py probe novels/walk-to-earn --runtime "${{ steps.runtime.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload current recovery 126-185
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/walk_confirmed_direct_upload_119_185_20260910.py --runtime "${{ steps.runtime.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Finalize queue
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/walk_recover_114_185_20260910.py finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "walk-recovery-bot"
          git config user.email "walk-recovery-bot@users.noreply.github.com"
          git add novels/walk-to-earn/platform-sync novels/walk-to-earn/audits
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(walk): record September recovery completion [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
