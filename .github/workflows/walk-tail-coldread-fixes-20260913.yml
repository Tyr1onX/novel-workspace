name: Walk Tail Cold Read Fixes 20260913

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/walk-tail-coldread-fixes-20260913.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase latest main
        shell: powershell
        run: |
          git fetch origin main
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply exact manual cold-read fixes
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/walk_tail_coldread_fixes_20260913.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit only unpublished chapter fixes
        shell: powershell
        run: |
          $changed = @(git status --porcelain -- novels/walk-to-earn/chapters/chapter-151.md novels/walk-to-earn/chapters/chapter-155.md novels/walk-to-earn/chapters/chapter-164.md novels/walk-to-earn/chapters/chapter-171.md novels/walk-to-earn/chapters/chapter-176.md novels/walk-to-earn/chapters/chapter-178.md novels/walk-to-earn/chapters/chapter-181.md novels/walk-to-earn/chapters/chapter-182.md novels/walk-to-earn/chapters/chapter-183.md novels/walk-to-earn/chapters/chapter-184.md novels/walk-to-earn/chapters/chapter-185.md)
          if ($changed.Count -eq 0) { throw "Expected cold-read chapter fixes but working tree is unchanged." }
          git config user.name "walk-quality-bot"
          git config user.email "walk-quality-bot@users.noreply.github.com"
          git add -- novels/walk-to-earn/chapters/chapter-151.md novels/walk-to-earn/chapters/chapter-155.md novels/walk-to-earn/chapters/chapter-164.md novels/walk-to-earn/chapters/chapter-171.md novels/walk-to-earn/chapters/chapter-176.md novels/walk-to-earn/chapters/chapter-178.md novels/walk-to-earn/chapters/chapter-181.md novels/walk-to-earn/chapters/chapter-182.md novels/walk-to-earn/chapters/chapter-183.md novels/walk-to-earn/chapters/chapter-184.md novels/walk-to-earn/chapters/chapter-185.md
          git commit -m "fix(walk): apply final cold-read corrections [skip ci]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
