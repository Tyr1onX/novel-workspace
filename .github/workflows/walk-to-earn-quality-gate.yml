name: Walk to Earn Quality Gate

on:
  pull_request:
    paths:
      - "novels/walk-to-earn/chapters/**"
      - "novels/walk-to-earn/style/**"
      - "novels/walk-to-earn/tools/**"
      - "shared/*RULES.md"
      - "shared/DIALOGUE_APPRENTICESHIP.md"
      - "shared/tools/*guard.py"
      - "shared/tools/novel_gate.py"
      - ".github/workflows/walk-to-earn-quality-gate.yml"
  push:
    branches:
      - main
    paths:
      - "novels/walk-to-earn/chapters/**"
      - "novels/walk-to-earn/style/**"
      - "novels/walk-to-earn/tools/**"
      - "shared/*RULES.md"
      - "shared/DIALOGUE_APPRENTICESHIP.md"
      - "shared/tools/*guard.py"
      - "shared/tools/novel_gate.py"
      - ".github/workflows/walk-to-earn-quality-gate.yml"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check protected Walk to Earn facts
        run: python novels/walk-to-earn/tools/check_rebuild_invariants.py

      - name: Run full novel gate on every current chapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit
          mapfile -t chapters < <(find novels/walk-to-earn/chapters -maxdepth 1 -type f -name 'chapter-*.md' | sort)
          if (( ${#chapters[@]} == 0 )); then
            echo "No Walk to Earn chapters found."
            exit 1
          fi
          python shared/tools/novel_gate.py "${chapters[@]}" 2>&1 | tee .audit/walk-to-earn-novel-gate.log

      - name: Plan release batches against 6000-char floor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p novels/walk-to-earn/audits
          python novels/walk-to-earn/tools/check_release_floor.py --start 44 \
            | tee .audit/walk-to-earn-release-floor.log \
            > novels/walk-to-earn/audits/release-floor-current.json
          cat novels/walk-to-earn/audits/release-floor-current.json

      - name: Persist current release-floor audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          path="novels/walk-to-earn/audits/release-floor-current.json"
          if [[ -z "$(git status --porcelain -- "$path")" ]]; then
            echo "Release-floor audit unchanged."
            exit 0
          fi
          git config user.name "walk-quality-bot"
          git config user.email "walk-quality-bot@users.noreply.github.com"
          git add -- "$path"
          git commit -m "chore(walk): refresh release-floor audit"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-to-earn-quality-gate
          path: .audit/
          if-no-files-found: warn
