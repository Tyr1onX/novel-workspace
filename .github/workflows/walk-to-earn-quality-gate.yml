name: Walk to Earn Quality Gate
# current-main verification trigger: 2026-09-12 after repeated-tail cleanup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "novels/walk-to-earn/chapters/**"
      - "novels/walk-to-earn/style/**"
      - "novels/walk-to-earn/tools/**"
      - "shared/*RULES.md"
      - "shared/DIALOGUE_APPRENTICESHIP.md"
      - "shared/tools/*guard.py"
      - "shared/tools/novel_gate.py"
      - ".github/workflows/walk-to-earn-quality-gate.yml"
  push:
    branches:
      - main
    paths:
      - "novels/walk-to-earn/chapters/**"
      - "novels/walk-to-earn/style/**"
      - "novels/walk-to-earn/tools/**"
      - "shared/*RULES.md"
      - "shared/DIALOGUE_APPRENTICESHIP.md"
      - "shared/tools/*guard.py"
      - "shared/tools/novel_gate.py"
      - ".github/workflows/walk-to-earn-quality-gate.yml"

permissions:
  contents: write

jobs:
  quality:
    runs-on: [self-hosted, windows, fanqie]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject batch template markers
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/check_template_markers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check protected Walk to Earn facts
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          python novels/walk-to-earn/tools/check_rebuild_invariants.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full novel gate on every current chapter
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          New-Item -ItemType Directory -Force .audit | Out-Null
          $chapters = @(Get-ChildItem -Path "novels/walk-to-earn/chapters" -Filter "chapter-*.md" | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($chapters.Count -eq 0) {
            Write-Error "No Walk to Earn chapters found."
            exit 1
          }
          python shared/tools/novel_gate.py @chapters *> .audit\walk-to-earn-novel-gate.log
          $status = $LASTEXITCODE
          Get-Content .audit\walk-to-earn-novel-gate.log
          if ($status -ne 0) { exit $status }

      - name: Enforce per-chapter body floor
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          New-Item -ItemType Directory -Force novels/walk-to-earn/audits | Out-Null
          New-Item -ItemType Directory -Force .audit | Out-Null
          $output = python novels/walk-to-earn/tools/audit_chapter_lengths.py --minimum 2000 --fail 2>&1
          $status = $LASTEXITCODE
          $output | Set-Content -Encoding UTF8 novels/walk-to-earn/audits/chapter-lengths-current.json
          $output | Set-Content -Encoding UTF8 .audit\walk-to-earn-chapter-lengths.log
          Get-Content novels/walk-to-earn/audits/chapter-lengths-current.json
          if ($status -ne 0) { exit $status }

      - name: Enforce five-chapter daily release floor
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          New-Item -ItemType Directory -Force novels/walk-to-earn/audits | Out-Null
          New-Item -ItemType Directory -Force .audit | Out-Null
          $output = python novels/walk-to-earn/tools/check_release_floor.py --start 61 --minimum 9999 --normal 5 --maximum 5 --require-all 2>&1
          $status = $LASTEXITCODE
          $output | Set-Content -Encoding UTF8 novels/walk-to-earn/audits/release-floor-current.json
          $output | Set-Content -Encoding UTF8 .audit\walk-to-earn-release-floor.log
          Get-Content novels/walk-to-earn/audits/release-floor-current.json
          if ($status -ne 0) { exit $status }

      - name: Persist current chapter audits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $paths = @(
            "novels/walk-to-earn/audits/chapter-lengths-current.json",
            "novels/walk-to-earn/audits/release-floor-current.json"
          )
          $changed = @(git status --porcelain -- $paths)
          if ($changed.Count -eq 0) {
            Write-Host "Chapter audits unchanged."
            exit 0
          }
          git config user.name "walk-quality-bot"
          git config user.email "walk-quality-bot@users.noreply.github.com"
          foreach ($path in $paths) { git add -- $path }
          git commit -m "chore(walk): refresh chapter audits"
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-to-earn-quality-gate
          path: .audit/
          if-no-files-found: warn
          include-hidden-files: true
