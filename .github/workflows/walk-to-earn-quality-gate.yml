name: Walk to Earn Quality Gate

on:
  pull_request:
    paths:
      - "novels/walk-to-earn/chapters/**"
      - "novels/walk-to-earn/style/**"
      - "novels/walk-to-earn/tools/**"
      - "shared/*RULES.md"
      - "shared/DIALOGUE_APPRENTICESHIP.md"
      - "shared/tools/*guard.py"
      - "shared/tools/novel_gate.py"
      - ".github/workflows/walk-to-earn-quality-gate.yml"
  push:
    branches:
      - main
    paths:
      - "novels/walk-to-earn/chapters/**"
      - "novels/walk-to-earn/style/**"
      - "novels/walk-to-earn/tools/**"
      - "shared/*RULES.md"
      - "shared/DIALOGUE_APPRENTICESHIP.md"
      - "shared/tools/*guard.py"
      - "shared/tools/novel_gate.py"
      - ".github/workflows/walk-to-earn-quality-gate.yml"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject batch template markers
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "这条记录只落在"
            "旁边写着"
            "第[0-9一二三四五六七八九十百零]+章第[0-9一二三四五六七八九十百零]+段"
          )
          failed=0
          for pattern in "${forbidden[@]}"; do
            if grep -R -n -E "$pattern" novels/walk-to-earn/chapters; then
              echo "Forbidden batch/template marker found: $pattern" >&2
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Walk to Earn quality gate failed: chapter text still contains batch-generated template markers." >&2
            exit 1
          fi

      - name: Check protected Walk to Earn facts
        run: python novels/walk-to-earn/tools/check_rebuild_invariants.py

      - name: Run full novel gate on every current chapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit
          mapfile -t chapters < <(find novels/walk-to-earn/chapters -maxdepth 1 -type f -name 'chapter-*.md' | sort)
          if (( ${#chapters[@]} == 0 )); then
            echo "No Walk to Earn chapters found."
            exit 1
          fi
          python shared/tools/novel_gate.py "${chapters[@]}" 2>&1 | tee .audit/walk-to-earn-novel-gate.log

      - name: Enforce per-chapter body floor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p novels/walk-to-earn/audits
          set +e
          python novels/walk-to-earn/tools/audit_chapter_lengths.py --minimum 2000 --fail \
            | tee .audit/walk-to-earn-chapter-lengths.log \
            > novels/walk-to-earn/audits/chapter-lengths-current.json
          status=${PIPESTATUS[0]}
          set -e
          cat novels/walk-to-earn/audits/chapter-lengths-current.json
          exit "$status"

      - name: Enforce five-chapter daily release floor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p novels/walk-to-earn/audits
          set +e
          python novels/walk-to-earn/tools/check_release_floor.py --start 61 --minimum 9999 --normal 5 --maximum 5 --require-all \
            | tee .audit/walk-to-earn-release-floor.log \
            > novels/walk-to-earn/audits/release-floor-current.json
          status=${PIPESTATUS[0]}
          set -e
          cat novels/walk-to-earn/audits/release-floor-current.json
          exit "$status"

      - name: Persist current chapter audits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "novels/walk-to-earn/audits/chapter-lengths-current.json"
            "novels/walk-to-earn/audits/release-floor-current.json"
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "Chapter audits unchanged."
            exit 0
          fi
          git config user.name "walk-quality-bot"
          git config user.email "walk-quality-bot@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "chore(walk): refresh chapter audits"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-to-earn-quality-gate
          path: .audit/
          if-no-files-found: warn
          include-hidden-files: true
